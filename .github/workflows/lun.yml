name: lun登录

on:
  schedule:
    - cron: '20 8 */2 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  restart:
    name: 执行重启脚本
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl gnupg
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay requests

      # # 🔐 启动 Cloudflare WARP（关键步骤）
      # - name: 🌐 Enable Cloudflare WARP
      #   uses: fscarmen/warp-on-actions@main
      #   with:
      #     mode: client     # 客户端模式（最常用）

      # # （可选）打印当前出口 IP，便于你验证
      # - name: 🔎 Show IP after WARP
      #   run: curl https://ip.luckyxz.pp.ua/json || true

      - name: 执行重启脚本
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u scripts/lun.py

#      - name: 上传截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: wispbyte-screenshots-${{ github.run_number }}
#          path: output/screenshots/*.png
#          retention-days: 7
#          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
